server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: ops-demo-order-service
  lifecycle:
    timeout-per-shutdown-phase: 20s

management:
  server:
    # 本机开发默认只允许本机访问；部署到虚拟机后通过环境变量改为 0.0.0.0
    address: ${MANAGEMENT_ADDRESS:127.0.0.1}
    port: ${MANAGEMENT_PORT:9091}
  endpoints:
    access:
      default: none
      max-permitted: read-only
    web:
      exposure:
        include:
          - health
          - info
          - prometheus
  endpoint:
    health:
      access: read-only
      show-details: never
      probes:
        enabled: true
    info:
      access: read-only
    prometheus:
      access: read-only
  info:
    env:
      enabled: true
    git:
      mode: simple
  metrics:
    tags:
      application: ${spring.application.name}
      service_id: order-demo
      environment: ${APP_ENV:local}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        ops.demo.order.preview.duration: true

info:
  app:
    name: ops-demo-order-service
    service-id: order-demo
    description: Spring Boot service for ops diagnosis demo

demo:
  product-client:
    # productId=999 用于稳定复现“上游返回空对象导致 NPE”的演示故障
    fault-product-id: ${FAULT_PRODUCT_ID:999}

logging:
  file:
    name: ${ORDER_LOG_FILE:./logs/application.log}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 100MB
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] traceId=%X{traceId:-} requestId=%X{requestId:-} %logger{40} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] traceId=%X{traceId:-} requestId=%X{requestId:-} %logger{40} - %msg%n"
  level:
    root: INFO
    com.example.opsdemo: INFO

